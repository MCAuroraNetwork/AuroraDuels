name: AuroraDuels
version: '${version}'
main: club.aurorapvp.AuroraDuels
api-version: 1.19
authors: [ Villagers654 ]
description: A Duels Plugin for the Aurora Network
website: aurorapvp.club
dependencies:
  - name: WorldEdit
    required: true
  - name: PlaceholderAPI
    required: false
  - name: AuroraKits
    required: false
  - name: AuroraCombat
    required: false
commands:
  auroraduels:
    description: AuroraDuels general plugin commands
    permission: auroraduels.admin
  duel:
    description: Starts a duel
    permission: auroraduels.duel
  ranked:
    description: Finds a ranked duel
    permission: auroraduels.duel
  urranked:
    description: Finds an unranked duel
    permission: auroraduels.duel
  queue:
    description: Manages custom queues
    permission: auroraduels.admin
  arena:
    description: Manages custom arenas
    permission: auroraduels.admin
permissions:
  auroraduels.admin:
    description: Enables use of AuroraDuels admin commands
    default: op
  auroraduels.duel:
    description: Enables use of AuroraDuels duel commands
    default: true
  auroraduels.default:
    description: Enables use of misc commands that anyone should be able to use
    default: true