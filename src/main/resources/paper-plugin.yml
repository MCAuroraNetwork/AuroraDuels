name: AuroraDuels
version: '${version}'
main: club.aurorapvp.auroraduels.AuroraDuels
api-version: '1.19'
authors: [ Villagers654 ]
description: A Duels Plugin for the Aurora Network
website: aurorapvp.club
commands:
  auroraduels:
    description: AuroraDuels general plugin commands
    permission: auroraduels.command.auroraduels
  duel:
    description: Starts a duel
    permission: auroraduels.command.duel
  ranked:
    description: Finds a ranked duel
    permission: auroraduels.command.ranked
  unranked:
    description: Finds an unranked duel
    permission: auroraduels.command.unranked
  rematch:
    description: Allows for players to challenge other players to a rematch
    permission: auroraduels.command.rematch
  queue:
    description: Manages custom queues
    permission: auroraduels.command.queue
  arena:
    description: Manages custom arenas
    permission: auroraduels.command.arena
  partyduel:
    description: Allows the formation of party duels
    permission: auroraduels.command.partyduel
  teamduel:
    description: Allows the formation of team vs team duels
    permission: auroraduels.command.teamduel
  ffaduel:
    description: Allows the formation of FFA "duels"
    permission: auroraduels.command.ffaduel
permissions:
  auroraduels.command.auroraduels:
    default: false
  auroraduels.command.queue:
    default: false
  auroraduels.command.arena:
    default: false
  auroraduels.command.duel:
    default: false
  auroraduels.command.partyduel:
    default: false
  auroraduels.command.teamduel:
    default: false
  auroraduels.command.ffaduel:
    default: false
  auroraduels.command.rematch:
    default: false
  auroraduels.command.ranked:
    default: false
  auroraduels.command.unranked:
    default: false
  auroraduels.admin:
    description: Enables use of AuroraDuels admin commands
    default: op
    children:
      auroraduels.command.auroraduels: true
      auroraduels.command.queue: true
      auroraduels.command.arena: true
  auroraduels.duel:
    description: Enables use of AuroraDuels duel commands
    default: true
    children:
      auroraduels.command.duel: true
      auroraduels.command.partyduel: true
      auroraduels.command.teamduel: true
      auroraduels.command.ffaduel: true
      auroraduels.command.rematch: true
      auroraduels.command.ranked: true
      auroraduels.command.unranked: true
  auroraduels.default:
    description: Enables use of AuroraDuels basic commands
    default: true
    children:
      auroraduels.command.auroraduels: true

dependencies:
  - name: WorldEdit
    required: true
    bootstrap: false
  - name: PlaceholderAPI
    required: false
    bootstrap: false
  - name: AuroraKits
    required: false
    bootstrap: false
  - name: AuroraCombat
    required: false
    bootstrap: false
  - name: AuroraTeleports
    required: false
    bootstrap: false