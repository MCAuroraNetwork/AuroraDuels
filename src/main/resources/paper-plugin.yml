name: AuroraDuels
version: '${version}'
main: club.aurorapvp.auroraduels.AuroraDuels
api-version: '1.21'
authors: [ Villagers654 ]
description: A Duels Plugin for the Aurora Network
website: aurorapvp.club
permissions:
  auroraduels.command.queue:
    default: false
    children:
      auroraduels.command.queue.create: true
  auroraduels.command.queue.create:
    default: false

  auroraduels.command.auroraduels:
    default: false
    children:
      auroraduels.command.auroraduels.reload: false
      auroraduels.command.auroraduels.help: true
  auroraduels.command.auroraduels.reload:
    default: false
  auroraduels.command.auroraduels.help:
    default: false

  auroraduels.command.arena:
    default: false
    children:
      auroraduels.command.arena.create: true
      auroraduels.command.arena.delete: true
      auroraduels.command.arena.reset: true
      auroraduels.command.arena.list: true
  auroraduels.command.arena.create:
    default: false
  auroraduels.command.arena.delete:
    default: false
  auroraduels.command.arena.reset:
    default: false
  auroraduels.command.arena.list:
    default: false

  auroraduels.command.rematch:
    default: false

  auroraduels.command.duel:
    default: false
    children:
      auroraduels.command.duel.accept: true
      auroraduels.command.duel.deny: true
      auroraduels.command.duel.spectate: true
      auroraduels.command.duel.kit: true
      auroraduels.command.duel.lobby: false
      auroraduels.command.duel.help: true
  auroraduels.command.duel.accept:
    default: false
  auroraduels.command.duel.deny:
    default: false
  auroraduels.command.duel.spectate:
    default: false
  auroraduels.command.duel.kit:
    default: false
  auroraduels.command.duel.lobby:
    default: false
  auroraduels.command.duel.help:
    default: false

  auroraduels.command.teamduel:
    default: false
    children:
      auroraduels.command.teamduel.random: true
  auroraduels.command.teamduel.random:
    default: false

  auroraduels.command.ffaduel:
    default: false

  auroraduels.command.ranked:
    default: false

  auroraduels.command.unranked:
    default: false

  auroraduels.default:
    description: Enables use of AuroraDuels basic commands
    default: true
    children:
      auroraduels.command.auroraduels: true

  auroraduels.admin:
    description: Enables use of AuroraDuels admin commands
    default: op
    children:
      auroraduels.command.queue: true
      auroraduels.command.arena: true
      auroraduels.command.auroraduels.reload: true
      auroraduels.command.duel.lobby: true

  auroraduels.duel:
    description: Enables use of AuroraDuels duel commands
    default: true
    children:
      auroraduels.command.duel: true
      auroraduels.command.partyduel: true
      auroraduels.command.teamduel: true
      auroraduels.command.ffaduel: true
      auroraduels.command.rematch: true
      auroraduels.command.ranked: true
      auroraduels.command.unranked: true

  auroraduels.bypass.commands:
    description: Allows bypassing duel command restrictions
    default: op

  auroraduels.bypass.teleports:
    description: Allows bypassing duel teleport restrictions
    default: op

dependencies:
  server:
    WorldEdit:
      required: true
    PlaceholderAPI:
      required: false
    DiscordSRV:
      required: false
    AuroraKits:
      required: false
    AuroraCombat:
      required: false
    AuroraWarps:
      required: false