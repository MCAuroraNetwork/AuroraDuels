name: AuroraDuels
version: '${version}'
main: club.aurorapvp.AuroraDuels
api-version: 1.19
authors: [ Villagers654 ]
description: A Duels Plugin for the Aurora Network
website: aurorapvp.club
depend:
  - WorldEdit
softdepend:
  - PlaceholderAPI
  - AuroraKits
commands:
  createarena:
    description: Starts the arena creation process
    permission: AuroraDuels.admin
  resetarena:
    description: Resets an arena
    permission: AuroraDuels.admin
  deletearena:
    description: Resets an arena
    permission: AuroraDuels.admin
  duel:
    description: Starts a duel
    permission: AuroraDuels.duel
  findmatch:
    description: Starts a duel
    permission: AuroraDuels.duel
  createqueue:
    description: Creates a custom queue
    permission: AuroraDuels.admin
  deletequeue:
    description: Deletes a custom queue
    permission: AuroraDuels.admin
  arenalist:
    description: lists all arenas
    permission: AuroraDuels.default
permissions:
  AuroraDuels.admin:
    description: Enables use of AuroraDuels admin commands
    default: op
  AuroraDuels.duel:
    description: Enables use of AuroraDuels duel commands
    default: true
  AuroraDuels.default:
    description: Enables use of misc commands that anyone should be able to use
    default: true