plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'AuroraDuels'
version = '1.14.1'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'm2-dv8tion'
        url 'https://m2.dv8tion.net/releases'
    }
    maven {
        url = 'https://nexus.scarsz.me/content/groups/public/'
    }
    maven {
        name = 'worldedit-bukkit'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        url = 'https://repo.aikar.co/content/groups/aikar/'
    }
    flatDir {
        dirs '.'
    }
}

dependencies {
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    implementation(platform("com.intellectualsites.bom:bom-newest:1.47"))

    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit'
    // TODO update
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // TODO update
    compileOnly 'com.discordsrv:discordsrv:1.27.0'
    compileOnly ':AuroraKits:1.8.1'
    compileOnly ':AuroraCombat:1.8.1'
    compileOnly ':AuroraWarps:1.3.1'
    compileOnly ':AuroraChat:1.0.1'
}

build {
    dependsOn(shadowJar)
}

shadowJar {
    minimize()
    archiveFileName.set("${project.name}-${project.version}.jar")
    relocate 'co.aikar.commands', 'club.aurorapvp.auroraduels.shaded.acf'
    relocate 'co.aikar.locales', 'club.aurorapvp.auroraduels.shaded.locales'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}